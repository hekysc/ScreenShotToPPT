name: Windows executable
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - run: python -m pip install -r requirements.txt pyinstaller
      - run: python -m unittest discover -s tests
      - run: pyinstaller --onefile --windowed --name ScreenShotToPPT-win-x64 --icon icon/icon.ico --add-data "icon;icon" main.py
      - uses: actions/upload-artifact@v4
        with:
          name: ScreenShotToPPT-win-x64
          path: dist/ScreenShotToPPT-win-x64.exe
